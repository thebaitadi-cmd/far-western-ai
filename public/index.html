<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Far Western AI</title>

<style>
body {
  margin:0;
  background:black;
  color:white;
  font-family:sans-serif;
}

h1 {
  text-align:center;
  background:linear-gradient(45deg,cyan,purple);
  -webkit-background-clip:text;
  color:transparent;
}

.chat {
  max-width:700px;
  margin:auto;
  padding-bottom:120px;
}

.msg {
  padding:12px;
  margin:10px;
  border-radius:12px;
  line-height:1.6;
  white-space:pre-wrap;
  max-width:85%;
}

.user {
  background:linear-gradient(45deg,blue,purple);
  margin-left:auto;
  text-align:right;
}

.bot {
  background:#111;
  border:1px solid cyan;
  box-shadow:0 0 10px cyan;
}

#bottom {
  position:fixed;
  bottom:0;
  width:100%;
  background:#000;
  padding:10px;
}

input {
  padding:10px;
  border:none;
  border-radius:8px;
  width:60%;
}

button {
  padding:10px;
  background:linear-gradient(45deg,cyan,purple);
  border:none;
  border-radius:8px;
  color:white;
}
</style>
</head>

<body>

<h1>🚀 Far Western AI</h1>

<div id="chat" class="chat"></div>

<div id="bottom">
  <input id="input" placeholder="Type..." />
  <button onclick="send()">Send</button>
  <button onclick="startVoice()">🎤</button>
</div>

<script>

const chat = document.getElementById("chat");

// =====================
// ADD MESSAGE
// =====================
function add(text,type) {
  const d = document.createElement("div");
  d.className = "msg " + type;
  d.innerText = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

// =====================
// TYPING EFFECT
// =====================
function typeText(text, callback) {
  const d = document.createElement("div");
  d.className = "msg bot";
  chat.appendChild(d);

  let i = 0;

  const interval = setInterval(()=>{
    d.innerText += text[i];
    i++;
    if(i >= text.length){
      clearInterval(interval);
      if(callback) callback(); // 🔥 speak after typing
    }
  },12);

  chat.scrollTop = chat.scrollHeight;
}

// =====================
// 🔥 SMART VOICE (LANG DETECT)
// =====================
function detectLang(text){
  if (/[\u0900-\u097F]/.test(text)) return "hi-IN"; // Hindi
  if (/[\u0900-\u097F]/.test(text)) return "ne-NP"; // Nepali approx
  return "en-US";
}

function getBestVoice(lang){
  const voices = speechSynthesis.getVoices();

  return (
    voices.find(v => v.lang === lang) ||
    voices.find(v => v.lang.startsWith(lang.split("-")[0])) ||
    voices[0]
  );
}

function speak(text){
  speechSynthesis.cancel(); // stop previous

  const lang = detectLang(text);
  const voice = getBestVoice(lang);

  const speech = new SpeechSynthesisUtterance(text);

  speech.voice = voice;
  speech.lang = voice.lang;

  speech.rate = 0.95;
  speech.pitch = 0.9;

  speechSynthesis.speak(speech);
}

// preload voices
speechSynthesis.onvoiceschanged = () => {};

// =====================
// SEND
// =====================
async function send() {
  const input = document.getElementById("input");
  const text = input.value;

  if(!text) return;

  add(text,"user");
  input.value = "";

  try {
    const res = await fetch("/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:text})
    });

    const data = await res.json();

    // 🔥 typing → then speak
    typeText(data.reply, ()=>{
      speak(data.reply);
    });

  } catch {
    add("Server error","bot");
  }
}

// =====================
// 🎤 VOICE INPUT
// =====================
function startVoice(){
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Voice not supported");
    return;
  }

  const rec = new SpeechRecognition();
  rec.lang = "auto";

  rec.onresult = e=>{
    const text = e.results[0][0].transcript;
    document.getElementById("input").value = text;
    send();
  };

  rec.start();
}

</script>

</body>
</html>
