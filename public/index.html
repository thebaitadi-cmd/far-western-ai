<script>

const chat = document.getElementById("chat");

// ✅ CLEAN TEXT (IMPORTANT)
function cleanText(text) {
  return text
    .replace(/([a-z])([A-Z])/g, "$1 $2")
    .replace(/\.([A-Za-z])/g, ". $1")
    .replace(/,/g, ", ")
    .replace(/\s+/g, " ")
    .trim();
}

// ✅ ADD MESSAGE
function add(text, type) {
  const d = document.createElement("div");
  d.className = "msg " + type;
  d.innerText = cleanText(text);
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

// ✅ TYPING EFFECT (FIXED)
async function typeText(text) {
  text = cleanText(text);

  const d = document.createElement("div");
  d.className = "msg bot typing";
  chat.appendChild(d);

  let i = 0;

  let interval = setInterval(() => {
    d.innerText += text[i];
    i++;

    if (i >= text.length) {
      clearInterval(interval);
      d.classList.remove("typing");
    }
  }, 15);
}

// ✅ VOICE OUTPUT (NATURAL)
function speak(text) {
  text = cleanText(text);

  const speech = new SpeechSynthesisUtterance(text);

  speech.lang = "hi-IN";   // 🔥 Hindi natural
  speech.rate = 0.9;       // slow clear
  speech.pitch = 1;
  speech.volume = 1;

  const voices = speechSynthesis.getVoices();
  speech.voice = voices.find(v => v.lang.includes("hi")) || voices[0];

  speechSynthesis.cancel(); // stop old
  speechSynthesis.speak(speech);
}

// ✅ SEND
async function send(voice=false) {
  let text = input.value;
  if (!text) return;

  add(text,"user");
  input.value="";

  const res = await fetch("/chat", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({message:text})
  });

  const data = await res.json();

  if (data.image) {
    chat.innerHTML += `<img src="${data.image}" width="300">`;
    return;
  }

  typeText(data.reply);

  if (voice) speak(data.reply);
}

// ✅ VOICE INPUT
function startVoice() {
  let rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  rec.lang="hi-IN";

  rec.onresult = (e)=>{
    input.value = e.results[0][0].transcript;
    send(true);
  };

  rec.start();
}

// ✅ IMAGE UPLOAD
async function upload() {
  let f = document.getElementById("file").files[0];
  let form = new FormData();
  form.append("image",f);

  const res = await fetch("/upload",{method:"POST",body:form});
  const data = await res.json();

  add(data.result,"bot");
}

</script>
