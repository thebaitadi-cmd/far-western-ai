<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Far Western AI</title>

<style>
body {
  margin:0;
  background:black;
  color:white;
  font-family:sans-serif;
}

h1 {
  text-align:center;
  background:linear-gradient(45deg,cyan,purple);
  -webkit-background-clip:text;
  color:transparent;
}

.chat {
  max-width:700px;
  margin:auto;
  padding-bottom:140px;
}

.msg {
  padding:12px;
  margin:10px;
  border-radius:12px;
  line-height:1.6;
  white-space:pre-wrap;
  word-break:break-word;
  max-width:85%;
}

.user {
  background:linear-gradient(45deg,blue,purple);
  margin-left:auto;
  text-align:right;
}

.bot {
  background:#111;
  border:1px solid cyan;
  box-shadow:0 0 10px cyan;
}

#bottom {
  position:fixed;
  bottom:0;
  width:100%;
  background:#000;
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.row {
  display:flex;
  gap:10px;
}

input {
  flex:1;
  padding:10px;
  border:none;
  border-radius:8px;
}

button {
  padding:10px;
  background:linear-gradient(45deg,cyan,purple);
  border:none;
  border-radius:8px;
  color:white;
  cursor:pointer;
}

.typing {
  border-right:2px solid white;
  animation: blink 1s infinite;
}

@keyframes blink {
  50% {border-color: transparent;}
}

img {
  max-width:90%;
  border-radius:10px;
  margin:10px;
}
</style>
</head>

<body>

<h1>🚀 Far Western AI</h1>

<div id="chat" class="chat"></div>

<div id="bottom">
  <div class="row">
    <input id="input" placeholder="Type..." />
    <button onclick="send()">Send</button>
    <button onclick="startVoice()">🎤</button>
  </div>

  <div class="row">
    <input type="file" id="file">
    <button onclick="upload()">Upload</button>
  </div>
</div>

<script>

const chat = document.getElementById("chat");

// =====================
// CLEAN TEXT (SMART)
// =====================
function cleanText(text) {
  return text
    .replace(/\s+/g," ")
    .replace(/([.,!?])/g, "$1 ")
    .trim();
}

// =====================
// ADD MESSAGE
// =====================
function add(text,type) {
  const d = document.createElement("div");
  d.className = "msg " + type;
  d.innerText = cleanText(text);

  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

// =====================
// TYPING EFFECT (SMOOTH)
// =====================
function typeText(text) {
  text = cleanText(text);

  const d = document.createElement("div");
  d.className = "msg bot typing";
  chat.appendChild(d);

  let i = 0;

  const speed = text.length > 100 ? 5 : 15;

  const interval = setInterval(()=>{
    d.innerText += text.charAt(i);
    i++;

    chat.scrollTop = chat.scrollHeight;

    if(i >= text.length){
      clearInterval(interval);
      d.classList.remove("typing");
    }
  }, speed);
}

// =====================
// 🔊 VOICE OUTPUT (AUTO LANGUAGE)
// =====================
function speak(text) {
  const speech = new SpeechSynthesisUtterance(text);

  // 🔥 better detection
  if (/[\u0900-\u097F]/.test(text)) {
    speech.lang = "hi-IN"; // Hindi/Nepali
  } else if (/[\u0980-\u09FF]/.test(text)) {
    speech.lang = "bn-IN";
  } else {
    speech.lang = "en-US";
  }

  speech.rate = 0.95;

  const voices = speechSynthesis.getVoices();
  speech.voice = voices.find(v => v.lang === speech.lang) || voices[0];

  speechSynthesis.cancel();
  speechSynthesis.speak(speech);
}

// =====================
// SEND MESSAGE
// =====================
async function send() {
  const input = document.getElementById("input");
  let text = input.value.trim();

  if(!text) return;

  add(text,"user");
  input.value="";

  const res = await fetch("/chat",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({message:text})
  });

  const data = await res.json();

  if(data.image){
    const img = document.createElement("img");
    img.src = data.image;
    chat.appendChild(img);
    chat.scrollTop = chat.scrollHeight;
    return;
  }

  typeText(data.reply);
  speak(data.reply);
}

// =====================
// 🎤 VOICE INPUT (AUTO FIX)
// =====================
function startVoice(){
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Voice not supported");
    return;
  }

  const rec = new SpeechRecognition();

  rec.continuous = false;
  rec.interimResults = false;

  // 🔥 AUTO LANGUAGE
  rec.lang = navigator.language || "en-US";

  rec.onresult = e=>{
    const text = e.results[0][0].transcript;
    document.getElementById("input").value = text;
    send();
  };

  rec.onerror = e=>{
    console.log("Voice error:", e);
  };

  rec.start();
}

// =====================
// IMAGE UPLOAD
// =====================
async function upload(){
  const file = document.getElementById("file").files[0];
  if(!file) return;

  const form = new FormData();
  form.append("image",file);

  const res = await fetch("/upload",{method:"POST",body:form});
  const data = await res.json();

  add(data.result,"bot");
}

</script>

</body>
</html>
