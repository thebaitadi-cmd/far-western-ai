<!DOCTYPE html>
<html>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Far Western AI</title>

<style>
body {
  margin:0;
  background:black;

}

.msg {

  white-space:pre-wrap;

}

.user {
  background:linear-gradient(45deg,blue,purple);

.bot {

#bottom {

input {
  padding:10px;
  border:none;
  border-radius:8px;

}

button {

  border-radius:8px;
  color:white;
}

</style>
</head>

  <button onclick="startVoice()">🎤</button>

</div>
