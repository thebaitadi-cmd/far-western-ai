<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Far Western AI</title>

<style>
body {
  margin:0;
  font-family:sans-serif;
  background:#000;
  color:#fff;
}

.chat {
  max-width:700px;
  margin:auto;
  padding:20px;
}

.msg {
  padding:12px;
  margin:10px 0;
  border-radius:10px;
}

.user { background:#2563eb; text-align:right; }
.bot { background:#111; }

input {
  width:70%;
  padding:12px;
}

button {
  padding:12px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="chat" id="chat"></div>

<div style="position:fixed;bottom:0;width:100%;background:#000;padding:10px;text-align:center;">
  <input id="input" placeholder="Ask anything...">
  <button onclick="send()">Send</button>
</div>

<script src="app.js"></script>

</body>
</html>
