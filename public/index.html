<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Far Western AI</title>

<style>
body {
  margin:0;
  background:black;
  color:white;
  font-family:sans-serif;
}

h1 {
  text-align:center;
  background:linear-gradient(45deg,cyan,purple);
  -webkit-background-clip:text;
  color:transparent;
}

.chat {
  max-width:700px;
  margin:auto;
  padding-bottom:120px;
}

.msg {
  padding:12px;
  margin:10px;
  border-radius:12px;
  line-height:1.6;
  white-space:pre-wrap;
  max-width:85%;
}

.user {
  background:linear-gradient(45deg,blue,purple);
  margin-left:auto;
  text-align:right;
}

.bot {
  background:#111;
  border:1px solid cyan;
  box-shadow:0 0 10px cyan;
}

#bottom {
  position:fixed;
  bottom:0;
  width:100%;
  background:#000;
  padding:10px;
}

input {
  padding:10px;
  border:none;
  border-radius:8px;
  width:60%;
}

button {
  padding:10px;
  background:linear-gradient(45deg,cyan,purple);
  border:none;
  border-radius:8px;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<h1>🚀 Far Western AI</h1>

<div id="chat" class="chat"></div>

<div id="bottom">
  <input id="input" placeholder="Type your message..." />
  <button onclick="send()">Send</button>
  <button onclick="startVoice()">🎤</button>
</div>

<script>

const chat = document.getElementById("chat");

// =====================
// ADD MESSAGE
// =====================
function add(text,type) {
  const d = document.createElement("div");
  d.className = "msg " + type;
  d.innerText = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

// =====================
// TYPING EFFECT (SMOOTH)
// =====================
function typeText(text, callback) {
  const d = document.createElement("div");
  d.className = "msg bot";
  chat.appendChild(d);

  let i = 0;

  const speed = 10;

  const interval = setInterval(()=>{
    d.innerText += text[i];
    i++;

    if(i >= text.length){
      clearInterval(interval);
      if(callback) callback();
    }
  }, speed);

  chat.scrollTop = chat.scrollHeight;
}

// =====================
// 🔊 STABLE HUMAN VOICE
// =====================
let selectedVoice = null;

function loadVoices() {
  const voices = speechSynthesis.getVoices();

  // 🔥 ONE fixed voice (no switching)
  selectedVoice =
    voices.find(v => v.name.includes("Google US English")) ||
    voices.find(v => v.lang === "en-US") ||
    voices[0];
}

speechSynthesis.onvoiceschanged = loadVoices;

function speak(text) {

  speechSynthesis.cancel(); // stop previous

  if (!selectedVoice) loadVoices();

  const speech = new SpeechSynthesisUtterance(text);

  speech.voice = selectedVoice;
  speech.lang = selectedVoice.lang;

  // 🔥 human tuning
  speech.rate = 0.9;
  speech.pitch = 0.95;
  speech.volume = 1;

  speechSynthesis.speak(speech);
}

// =====================
// SEND MESSAGE
// =====================
async function send() {

  const input = document.getElementById("input");
  const text = input.value.trim();

  if(!text) return;

  add(text,"user");
  input.value = "";

  try {
    const res = await fetch("/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:text})
    });

    const data = await res.json();

    if(!data.reply){
      add("No response","bot");
      return;
    }

    // typing → then speak
    typeText(data.reply, ()=>{
      speak(data.reply);
    });

  } catch (e) {
    add("Server error","bot");
  }
}

// =====================
// 🎤 VOICE INPUT
// =====================
function startVoice(){
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Voice not supported");
    return;
  }

  const rec = new SpeechRecognition();

  rec.lang = "en-US"; // 🔥 stable

  rec.onresult = e=>{
    const text = e.results[0][0].transcript;
    document.getElementById("input").value = text;
    send();
  };

  rec.start();
}

// =====================
// ENTER KEY SEND
// =====================
document.getElementById("input").addEventListener("keypress", function(e){
  if(e.key === "Enter"){
    send();
  }
});

</script>

</body>
</html>
