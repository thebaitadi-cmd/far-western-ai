<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Far Western AI</title>

<style>
body {
  margin:0;
  background:#000;
  color:#fff;
  font-family:sans-serif;
}

h1 {
  text-align:center;
  background:linear-gradient(45deg,cyan,purple);
  -webkit-background-clip:text;
  color:transparent;
}

.chat {
  max-width:700px;
  margin:auto;
  padding-bottom:120px;
}

.msg {
  padding:12px;
  margin:10px;
  border-radius:12px;
}

.user {
  background:linear-gradient(45deg,blue,purple);
  text-align:right;
}

.bot {
  background:#111;
  border:1px solid cyan;
  box-shadow:0 0 10px cyan;
}

#bottom {
  position:fixed;
  bottom:0;
  width:100%;
  background:#000;
  padding:10px;
}

input {
  padding:10px;
  border:none;
  border-radius:8px;
}

button {
  padding:10px;
  background:linear-gradient(45deg,cyan,purple);
  border:none;
  border-radius:8px;
  color:white;
}

.typing {
  border-right:2px solid white;
  animation: blink 1s infinite;
}

@keyframes blink {
  50% {border-color: transparent;}
}
</style>
</head>

<body>

<h1>🚀 Far Western AI</h1>

<div id="chat" class="chat"></div>

<div id="bottom">
  <input id="input" placeholder="Type..." />
  <button onclick="send()">Send</button>
  <button onclick="startVoice()">🎤</button>

  <br><br>

  <input type="file" id="file">
  <button onclick="upload()">Upload</button>
</div>

<script>

const chat = document.getElementById("chat");

function add(text, type) {
  const d = document.createElement("div");
  d.className = "msg " + type;
  d.innerText = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

// typing animation
async function typeText(text) {
  const d = document.createElement("div");
  d.className = "msg bot typing";
  chat.appendChild(d);

  let i = 0;
  let interval = setInterval(() => {
    d.innerText += text[i];
    i++;
    if (i >= text.length) {
      clearInterval(interval);
      d.classList.remove("typing");
    }
  }, 20);
}

// SEND
async function send(voice=false) {
  let text = input.value;
  if (!text) return;

  add(text,"user");
  input.value="";

  const res = await fetch("/chat", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({message:text})
  });

  const data = await res.json();

  if (data.image) {
    chat.innerHTML += `<img src="${data.image}" width="300">`;
    return;
  }

  typeText(data.reply);

  if (voice) speak(data.reply);
}

// VOICE
function startVoice() {
  let rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  rec.lang="en-US";

  rec.onresult = (e)=>{
    input.value = e.results[0][0].transcript;
    send(true);
  };

  rec.start();
}

// SPEAK
function speak(text) {
  let s = new SpeechSynthesisUtterance(text);
  speechSynthesis.speak(s);
}

// UPLOAD
async function upload() {
  let f = document.getElementById("file").files[0];
  let form = new FormData();
  form.append("image",f);

  const res = await fetch("/upload",{method:"POST",body:form});
  const data = await res.json();

  add(data.result,"bot");
}

</script>

</body>
</html>
