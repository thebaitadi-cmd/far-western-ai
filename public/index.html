<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Far Western AI</title>

<style>
body {
  font-family: sans-serif;
  background: #0f2027;
  color: #fff;
  margin: 0;
  display: flex;
  justify-content: center;
}

.container {
  width: 600px;
  margin-top: 50px;
}

h1 {
  text-align: center;
}

.chat-box {
  background: #fff;
  height: 400px;
  overflow-y: auto;
  border-radius: 15px;
  padding: 15px;
}

.msg {
  padding: 10px;
  margin: 10px 0;
  border-radius: 10px;
  max-width: 70%;
}

.user {
  background: purple;
  color: white;
  margin-left: auto;
}

.bot {
  background: #eee;
  color: black;
}

.input-area {
  display: flex;
  margin-top: 10px;
}

input {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: none;
}

button {
  padding: 10px 15px;
  margin-left: 5px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

.send {
  background: purple;
  color: white;
}

.mic {
  background: cyan;
}
</style>
</head>

<body>

<div class="container">
  <h1>🔥 FAR WESTERN AI</h1>

  <div id="chat-box" class="chat-box"></div>

  <div class="input-area">
    <input id="input" placeholder="Type message..." />
    <button class="send" onclick="sendText()">Send</button>
    <button class="mic" onclick="startVoice()">🎤</button>
  </div>
</div>

<script>
const input = document.getElementById("input");
const chatBox = document.getElementById("chat-box");

let isVoice = false;

// ✅ ADD MESSAGE
function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.innerText = text;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

// ✅ SPEAK (VOICE OUTPUT ONLY)
function speak(text) {
  const speech = new SpeechSynthesisUtterance(text);

  const voices = speechSynthesis.getVoices();
  const voice = voices.find(v => v.name.includes("Google") || v.lang.includes("en"));

  if (voice) speech.voice = voice;

  speech.rate = 1;
  speech.pitch = 1;

  speechSynthesis.speak(speech);
}

// ✅ TEXT SEND
async function sendText() {
  const message = input.value.trim();
  if (!message) return;

  isVoice = false;

  addMessage(message, "user");
  input.value = "";

  const res = await fetch("/chat", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ message })
  });

  const data = await res.json();

  // 🔥 ONLY TEXT OUTPUT
  addMessage(data.reply, "bot");
}

// ✅ VOICE INPUT
function startVoice() {
  const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();

  recognition.lang = "en-US";
  recognition.start();

  recognition.onresult = async (event) => {
    const text = event.results[0][0].transcript;

    isVoice = true;

    const res = await fetch("/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ message: text })
    });

    const data = await res.json();

    // 🔥 ONLY VOICE OUTPUT (NO TEXT)
    speak(data.reply);
  };

  recognition.onerror = () => {
    alert("Mic not working");
  };
}
</script>

</body>
</html>
