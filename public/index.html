<!DOCTYPE html>
<html>
<head>
  <title>Far Western AI</title>
  <style>
    body { background:black; color:white; font-family:sans-serif }
    #chat { max-width:600px; margin:auto; padding:20px }
    .msg { margin:10px; padding:10px; border-radius:10px }
    .user { background:#2563eb; text-align:right }
    .bot { background:#111 }
    input { width:75%; padding:10px }
    button { padding:10px }
  </style>
</head>
<body>

<h2 style="text-align:center">Far Western AI 🚀</h2>

<div id="chat"></div>

<div style="text-align:center">
  <input id="input" placeholder="Ask anything..." />
  <button onclick="send()">Send</button>
</div>

<script>
const API_URL = "https://ai.thebaitadi.com/chat"; // 🔥 YOUR DOMAIN

function addMsg(text, cls) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.innerText = text;
  document.getElementById("chat").appendChild(div);
}

async function send() {
  const input = document.getElementById("input");
  const msg = input.value;

  if (!msg) return;

  addMsg(msg, "user");
  input.value = "";

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ message: msg })
    });

    const data = await res.json();

    addMsg(data.reply || "No response", "bot");

  } catch (e) {
    addMsg("Connection error", "bot");
  }
}

// ENTER KEY SUPPORT
document.getElementById("input").addEventListener("keypress", function(e) {
  if (e.key === "Enter") send();
});
</script>

</body>
</html>
