<!DOCTYPE html>
<html>
<head>
  <title>Far Western AI</title>
  <style>
    body {
      background: black;
      color: white;
      font-family: sans-serif;
    }
    #chat {
      max-width: 600px;
      margin: auto;
      margin-top: 40px;
    }
    .msg {
      padding: 10px;
      margin: 10px;
      border-radius: 10px;
    }
    .user {
      background: blue;
      text-align: right;
    }
    .bot {
      background: #222;
    }
    #box {
      position: fixed;
      bottom: 10px;
      width: 100%;
      text-align: center;
    }
  </style>
</head>

<body>

<div id="chat"></div>

<div id="box">
  <input id="input" placeholder="Ask anything..." />
  <button onclick="send()">Send</button>
</div>

<script>
async function send() {
  const input = document.getElementById("input");
  const chat = document.getElementById("chat");

  const text = input.value.trim();
  if (!text) return;

  chat.innerHTML += `<div class="msg user">${text}</div>`;
  input.value = "";

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ message: text })
    });

    const data = await res.json();

    chat.innerHTML += `<div class="msg bot">${data.reply}</div>`;

  } catch (err) {
    chat.innerHTML += `<div class="msg bot">❌ Network Error</div>`;
  }
}

// ENTER KEY SUPPORT
document.getElementById("input").addEventListener("keypress", function(e) {
  if (e.key === "Enter") {
    send();
  }
});
</script>

</body>
</html>
