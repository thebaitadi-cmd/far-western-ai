<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>

<style>
body {
  margin:0;
  background:black;
  color:white;
  font-family:sans-serif;
  text-align:center;
}

h1 {
  background:linear-gradient(45deg,cyan,purple);
  -webkit-background-clip:text;
  color:transparent;
}

#bottom {
  position:fixed;
  bottom:0;
  width:100%;
  background:#000;
  padding:10px;
}

input {
  padding:10px;
  border:none;
  border-radius:8px;
  width:60%;
}

button {
  padding:10px;
  background:linear-gradient(45deg,cyan,purple);
  border:none;
  border-radius:8px;
  color:white;
}
</style>
</head>

<body>

<h1>🎙️ JARVIS AI</h1>

<div id="bottom">
  <input id="input" placeholder="Speak..." />
  <button onclick="startVoice()">🎤</button>
</div>

<script>

let currentAudio=null;
let recognition=null;
let controller=null;

// =====================
// 🔊 SPEAK
// =====================
async function speak(text){

  try{
    if(currentAudio){
      currentAudio.pause();
      currentAudio=null;
    }

    const res=await fetch("/tts",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({text})
    });

    const blob=await res.blob();
    const url=URL.createObjectURL(blob);

    const audio=new Audio(url);
    currentAudio=audio;

    audio.onended=()=>{
      URL.revokeObjectURL(url);

      // 🔥 AUTO LISTEN AGAIN
      startVoice();
    };

    audio.play();

  }catch(e){
    console.log(e);
  }
}

// =====================
// 🚀 SEND
// =====================
async function send(text){

  if(currentAudio){
    currentAudio.pause();
    currentAudio=null;
  }

  if(controller){
    controller.abort();
  }

  controller=new AbortController();

  try{
    const res=await fetch("/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:text}),
      signal:controller.signal
    });

    const data=await res.json();
    speak(data.reply);

  }catch(e){
    console.log("cancel/error",e);
  }
}

// =====================
// 🎤 VOICE INPUT (CONTINUOUS)
// =====================
function startVoice(){

  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

  if(!SR){
    alert("Voice not supported");
    return;
  }

  // 🔥 stop voice instantly
  if(currentAudio){
    currentAudio.pause();
    currentAudio=null;
  }

  // 🔥 cancel old request
  if(controller){
    controller.abort();
  }

  recognition=new SR();
  recognition.lang="en-US";
  recognition.continuous=false;

  recognition.onresult=e=>{
    const text=e.results[0][0].transcript;
    send(text);
  };

  recognition.onend=()=>{
    // 🔥 keep listening (JARVIS mode)
    setTimeout(startVoice,500);
  };

  recognition.start();
}

</script>

</body>
</html>
