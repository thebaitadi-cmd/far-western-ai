<!DOCTYPE html>
<html>
<head>
  <title>Far Western AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🔥 Far Western AI</h1>

<!-- CHAT -->
<div class="box">
  <input id="userInput" placeholder="Type message">
  <button onclick="sendMessage()">Send</button>
</div>

<!-- GENERATE -->
<div class="box">
  <input id="imgPrompt" placeholder="Image prompt">
  <button onclick="generateImage()">Generate</button>
  <br><br>
  <img id="imgResult" width="300">
</div>

<!-- EDIT -->
<div class="box">
  <input type="file" id="editFile">
  <input id="editPrompt" placeholder="Edit prompt">
  <button onclick="editImage()">Edit</button>
  <br><br>
  <img id="editResult" width="300">
</div>

<script src="script.js"></script>

</body>
</html>
