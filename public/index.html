<!DOCTYPE html>
<html>
<head>
<title>Far Western AI</title>
<style>
body { background:black; color:white; font-family:sans-serif; }
.chat { max-width:600px; margin:auto; padding-top:50px; }
.msg { padding:10px; margin:10px; border-radius:10px; }
.user { background:blue; text-align:right; }
.bot { background:#222; }
</style>
</head>

<body>
<div class="chat" id="chat"></div>

<input id="input" placeholder="Ask anything...">
<button onclick="send()">Send</button>

<script>
async function send() {
  const input = document.getElementById("input");
  const chat = document.getElementById("chat");

  const userMsg = input.value;
  chat.innerHTML += `<div class="msg user">${userMsg}</div>`;

  const res = await fetch("/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: userMsg })
  });

  const data = await res.json();

  chat.innerHTML += `<div class="msg bot">${data.reply}</div>`;
  input.value = "";
}
</script>
</body>
</html>
