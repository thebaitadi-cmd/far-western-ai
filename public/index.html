<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Far Western AI</title>

<style>
body {
  margin:0;
  background:black;
  color:white;
  font-family:sans-serif;
}

h1 {
  text-align:center;
  background:linear-gradient(45deg,cyan,purple);
  -webkit-background-clip:text;
  color:transparent;
}

.chat {
  max-width:700px;
  margin:auto;
  padding-bottom:120px;
}

.msg {
  padding:12px;
  margin:10px;
  border-radius:12px;
  line-height:1.6;
  white-space:pre-wrap;
  word-wrap:break-word;
  max-width:85%;
}

.user {
  background:linear-gradient(45deg,blue,purple);
  margin-left:auto;
  text-align:right;
}

.bot {
  background:#111;
  border:1px solid cyan;
  box-shadow:0 0 10px cyan;
}

#bottom {
  position:fixed;
  bottom:0;
  width:100%;
  background:#000;
  padding:10px;
}

input {
  padding:10px;
  border:none;
  border-radius:8px;
  width:60%;
}

button {
  padding:10px;
  background:linear-gradient(45deg,cyan,purple);
  border:none;
  border-radius:8px;
  color:white;
}

.typing {
  border-right:2px solid white;
  animation: blink 1s infinite;
}

@keyframes blink {
  50% {border-color: transparent;}
}
</style>
</head>

<body>

<h1>🚀 Far Western AI</h1>

<div id="chat" class="chat"></div>

<div id="bottom">
  <input id="input" placeholder="Type..." />
  <button onclick="send()">Send</button>
  <button onclick="startVoice()">🎤</button>

  <br><br>

  <input type="file" id="file">
  <button onclick="upload()">Upload</button>
</div>

<script>

const chat = document.getElementById("chat");

// =====================
// ADD MESSAGE
// =====================
function add(text,type) {
  const d = document.createElement("div");
  d.className = "msg " + type;
  d.innerText = text.trim();
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

// =====================
// TYPING EFFECT (BOX FIXED)
// =====================
function typeText(text) {
  const d = document.createElement("div");
  d.className = "msg bot";
  chat.appendChild(d);

  let i = 0;

  const interval = setInterval(()=>{
    d.innerText += text[i];
    i++;
    if(i>=text.length){
      clearInterval(interval);
    }
  },15);

  chat.scrollTop = chat.scrollHeight;
}

// =====================
// 🔊 VOICE FIX (NO MIX)
// =====================
let selectedVoice = null;

function loadVoice() {
  const voices = speechSynthesis.getVoices();

  selectedVoice =
    voices.find(v => v.name.includes("Google US English")) ||
    voices.find(v => v.lang === "en-US") ||
    voices[0];
}

speechSynthesis.onvoiceschanged = loadVoice;

function speak(text) {
  speechSynthesis.cancel(); // stop mixing

  if (!selectedVoice) loadVoice();

  const speech = new SpeechSynthesisUtterance(text);

  speech.voice = selectedVoice;
  speech.lang = selectedVoice.lang;

  speech.rate = 0.9;
  speech.pitch = 0.85;

  speechSynthesis.speak(speech);
}

// =====================
// SEND
// =====================
async function send() {
  const input = document.getElementById("input");
  let text = input.value;

  if(!text) return;

  add(text,"user");
  input.value="";

  const res = await fetch("/chat",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({message:text})
  });

  const data = await res.json();

  if(data.image){
    chat.innerHTML += `<img src="${data.image}" width="300">`;
    return;
  }

  typeText(data.reply);
  speak(data.reply);
}

// =====================
// 🎤 VOICE INPUT FIX
// =====================
function startVoice(){
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Voice not supported");
    return;
  }

  const rec = new SpeechRecognition();

  rec.lang = navigator.language || "en-US";

  rec.onresult = e=>{
    const text = e.results[0][0].transcript;
    document.getElementById("input").value = text;
    send();
  };

  rec.start();
}

// =====================
// IMAGE UPLOAD
// =====================
async function upload(){
  const file = document.getElementById("file").files[0];
  const form = new FormData();
  form.append("image",file);

  const res = await fetch("/upload",{method:"POST",body:form});
  const data = await res.json();

  add(data.result,"bot");
}

</script>

</body>
</html>
