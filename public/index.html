<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Far Western AI</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: radial-gradient(circle, #0f2027, #203a43, #2c5364);
      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 20px;
      font-size: 32px;
      text-shadow: 0 0 10px cyan;
    }

    #chat {
      width: 90%;
      max-width: 600px;
      margin: 20px auto;
      height: 400px;
      overflow-y: auto;
      background: rgba(0,0,0,0.5);
      border-radius: 10px;
      padding: 10px;
      box-shadow: 0 0 15px cyan;
      text-align: left;
    }

    .msg {
      margin: 10px;
      padding: 10px;
      border-radius: 8px;
    }

    .user {
      background: #00c6ff;
      color: black;
      text-align: right;
    }

    .bot {
      background: #222;
      color: #00ffea;
    }

    #inputBox {
      margin: 20px;
    }

    input {
      padding: 10px;
      width: 60%;
      border-radius: 5px;
      border: none;
      outline: none;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      background: cyan;
      cursor: pointer;
      margin-left: 5px;
      font-weight: bold;
    }

    button:hover {
      background: #00ffea;
    }
  </style>
</head>

<body>

  <h1>🤖 Far Western AI</h1>

  <div id="chat"></div>

  <div id="inputBox">
    <input id="input" placeholder="Ask anything..." />
    <button onclick="sendMessage()">Send</button>
  </div>

  <script>
    async function sendMessage() {
      const input = document.getElementById("input");
      const chat = document.getElementById("chat");

      const msg = input.value;
      if (!msg) return;

      addMessage(msg, "user");
      input.value = "";

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ message: msg })
        });

        const data = await res.json();

        addMessage(data.reply, "bot");

      } catch (err) {
        addMessage("❌ Error connecting to AI", "bot");
      }
    }

    function addMessage(text, type) {
      const chat = document.getElementById("chat");

      const div = document.createElement("div");
      div.classList.add("msg", type);
      div.innerText = text;

      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }
  </script>

</body>
</html>
