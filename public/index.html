<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Far Western AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: radial-gradient(circle at top, #0f172a, #020617);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  gap: 15px;
}

/* 🔥 SIDE PANELS */
.side-panel {
  width: 180px;
  height: 92vh;
  background: rgba(15, 23, 42, 0.85);
  border-radius: 16px;
  padding: 10px;
  color: white;
  font-size: 12px;
  overflow-y: auto;

  box-shadow:
    0 0 10px rgba(0,255,225,0.1),
    0 0 20px rgba(0,255,225,0.05);
}

.panel-title {
  font-weight: bold;
  margin-bottom: 8px;
  color: #00ffe1;
}

/* 📦 MAIN CHAT */
.container {
  width: 90%;
  max-width: 520px;
  height: 92vh;
  background: rgba(15, 23, 42, 0.95);
  border-radius: 18px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;

  box-shadow:
    0 0 20px rgba(0,255,225,0.15),
    0 0 40px rgba(0,255,225,0.1);
}

/* 🔥 HEADER */
.top-bar {
  display: flex;
  justify-content: center;
  padding: 12px 0;
}

.top-title {
  padding: 6px 16px;
  border-radius: 20px;
  font-size: 16px;
  font-weight: bold;

  background: rgba(2, 6, 23, 0.8);
  border: 1px solid rgba(0,255,225,0.2);

  background-image: linear-gradient(90deg, #ff00cc, #00ffe1, #ffaa00);
  -webkit-background-clip: text;
  color: transparent;

  box-shadow: 0 0 10px rgba(0,255,225,0.2);
}

/* 💬 CHAT */
#chat {
  flex: 1;
  overflow-y: auto;
  padding: 15px;
  display: flex;
  flex-direction: column;
}

/* 💬 MESSAGE */
.msg {
  padding: 10px 14px;
  margin: 8px 0;
  border-radius: 10px;
  max-width: 80%;
  color: white;
  font-size: 14px;
}

/* 👤 USER */
.user {
  align-self: flex-start;
  background: rgba(59, 130, 246, 0.2);
  box-shadow: 0 0 5px #00ffe1, 0 0 10px #00bcd4;
}

/* 🤖 BOT */
.bot {
  align-self: flex-end;
  background: rgba(148, 163, 184, 0.15);
  box-shadow: 0 0 5px #ff00cc, 0 0 10px #00ffe1, 0 0 15px #ffaa00;
}

/* ⌨️ INPUT */
.inputBox {
  display: flex;
  padding: 10px;
  background: #020617;
  border-top: 1px solid #1e293b;
}

.inputBox input {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  border: none;
  outline: none;
  background: #0f172a;
  color: white;

  box-shadow: 0 0 5px #00ffe1, 0 0 10px #ff00cc;
}

.inputBox button {
  margin-left: 8px;
  padding: 10px 14px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

#send {
  background: linear-gradient(45deg, #00ffe1, #00bcd4);
}

#mic {
  background: linear-gradient(45deg, #ff0055, #ff5252);
  color: white;
}

/* 🔥 OVERLAY */
.overlay {
  position: absolute;
  inset: 0;
  background: rgba(2, 6, 23, 0.96);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 50;
  flex-direction: column;
}

.stop-btn {
  margin-top: 20px;
  padding: 10px 20px;
  background: #ff0055;
  border: none;
  border-radius: 8px;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.hidden {
  display: none;
}

.ai-box {
  text-align: center;
}

.ai-main {
  font-size: 30px;
  font-weight: bold;
  background: linear-gradient(90deg, #ff00cc, #00ffe1, #ffaa00);
  -webkit-background-clip: text;
  color: transparent;
}

.ai-sub {
  margin-top: 8px;
  font-size: 14px;
  color: #94a3b8;
  letter-spacing: 2px;
}
</style>
</head>

<body>

<!-- 🧠 LEFT PANEL -->
<div class="side-panel">
  <div class="panel-title">🧠 Memory</div>
  <div id="memoryBox">No memory yet</div>

  <div class="panel-title" style="margin-top:10px;">🎯 Goal</div>
  <div id="goalBox">No goal set</div>
</div>

<!-- 💬 MAIN CHAT -->
<div class="container">

  <div class="top-bar">
    <div class="top-title">Far-Western AI</div>
  </div>

  <div id="chat"></div>

  <div class="inputBox">
    <input id="msg" placeholder="Type message...">
    <button id="send">Send</button>
    <button id="mic">🎤 Mic</button>
  </div>

  <div id="voiceOverlay" class="overlay hidden">
    <div class="ai-box">
      <div class="ai-main">Far Western AI</div>
      <div class="ai-sub">THE SUPER AI BRAIN</div>
    </div>

    <button class="stop-btn" onclick="stopMic()">Stop Voice</button>
  </div>

</div>

<!-- 🌐 RIGHT PANEL -->
<div class="side-panel">
  <div class="panel-title">🌐 Live Search</div>
  <div id="searchBox">No data</div>

  <div class="panel-title" style="margin-top:10px;">⚡ AI Status</div>
  <div id="aiStatus">Active</div>
</div>

<script src="app.js"></script>

</body>
</html>
